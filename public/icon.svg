  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3"/>
  <!-- Orchid petals stylized -->
