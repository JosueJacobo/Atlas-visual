    <path d="M -80,120 C -60,40 0,10 0,30 C -20,70 -40,110 -80,120 Z" fill="url(#petal1)" opacity="0.85"/>
    <path d="M 80,120 C 60,40 0,10 0,30 C 20,70 40,110 80,120 Z" fill="url(#petal1)" opacity="0.85"/>
    <circle cx="0" cy="15" r="28" fill="#fbbf24"/>
