  <text x="256" y="440" font-family="serif" font-size="34" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="4">ATLAS ORQUÍDEAS</text>
  <text x="256" y="475" font-family="sans-serif" font-size="18" font-weight="600" fill="#f59e0b" text-anchor="middle" letter-spacing="6">MÉXICO</text>
